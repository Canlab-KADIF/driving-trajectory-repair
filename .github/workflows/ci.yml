#
# A full compile is not run here: the packages depend on ROS message
# definitions that are not publicly distributed (see README). CI therefore
# gates on what can be verified from the sources alone.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release-gate:
    name: license and hygiene gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Run release gate
        run: bash scripts/check_release_ready.sh

  cpp-format:
    name: clang-format
    runs-on: ubuntu-latest
    if: hashFiles('.clang-format') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          files=$(find src -name '*.h' -o -name '*.cc')
          if [ -n "$files" ]; then
            echo "$files" | xargs clang-format --dry-run --Werror
          fi

  python-lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          if find src -name '*.py' | grep -q .; then
            ruff check src
          else
            echo "no Python sources"
          fi
