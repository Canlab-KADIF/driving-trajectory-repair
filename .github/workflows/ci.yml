#
# A full colcon build is not run here: the package depends on a ROS message
# package that is not publicly distributed (see README). What does not depend
# on it -- the geometry, motion models and curve fitting -- is compiled and
# tested for real, on the Ubuntu release of each supported ROS 2 distro.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release-gate:
    name: license and hygiene gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Run release gate
        run: bash scripts/check_release_ready.sh

  unit-tests:
    name: unit tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: humble }
          - { os: ubuntu-24.04, name: jazzy }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgtest-dev libeigen3-dev
      # The geometry, motion-model and curve-fitting targets have no ROS and no
      # private dependency, so they compile and run here. A full colcon build
      # cannot: cyber_perception_msgs is not publicly distributed.
      - name: Build and run the ROS-free tests
        working-directory: src/bag_modifier
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -I include -I /usr/include/eigen3 \
              test/test_geometry.cc \
              test/test_obstacle_pose_estimator.cc \
              test/test_spline_solver.cc \
              src/geometry/box2d.cc \
              src/geometry/polygon_iou.cc \
              src/track/obstacle_pose_estimator.cc \
              src/spline/spline_solver.cc \
              -lgtest -lgtest_main -pthread -o test_bag_modifier_geometry
          ./test_bag_modifier_geometry

  cpp-format:
    name: clang-format
    runs-on: ubuntu-latest
    if: hashFiles('.clang-format') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          files=$(find src -name '*.h' -o -name '*.cc')
          if [ -n "$files" ]; then
            echo "$files" | xargs clang-format --dry-run --Werror
          fi

  python-lint:
    name: ruff (launch files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          if find src -name '*.py' | grep -q .; then
            ruff check src
          else
            echo "no Python sources"
          fi
