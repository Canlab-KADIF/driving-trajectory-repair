#
# Tuning for the offline track repair. Every value here was a compile-time
# #define before, so retuning for a new recording no longer needs a rebuild.
#
# Pass with:  --ros-args --params-file config/driving_trajectory_repair.yaml

/**:
  ros__parameters:

    # Topic carrying the recorded perception stream to repair
    obstacle_topic: "/obstacles"

    # Topic the synthesised poses are written to in the second output bag
    interpolated_topic: "/obstacles_modified"

    # Perception frames closer together than this in seconds are the same detection
    # cycle written twice by the recorder, and the duplicate is dropped
    duplicate_frame_tolerance: 0.00001

    # --- re-identification gating -----------------------------------------------

    # How long a track that perception dropped stays eligible to be matched against
    # a newly appearing one, in seconds. Longer accepts more matches but starts
    # pairing unrelated objects once the prediction has drifted.
    reidentification_window: 2.0

    # Largest speed difference between the prediction and the new detection still
    # accepted as the same object, in m/s. 13.9 m/s is 50 km/h.
    max_speed_error: 13.9

    # Largest heading difference still accepted, in radians
    max_heading_error: 1.5707963

    # Weights of the heading and speed terms in the match score. The overlap term
    # carries an implicit weight of 1, so these decide how much a good heading or
    # speed agreement can compensate for a weak overlap.
    heading_similarity_weight: 0.5
    speed_similarity_weight: 0.5

    # --- motion model -----------------------------------------------------------

    # Below this average speed the object is treated as parked and its pose is held
    # rather than integrated forward, in m/s. 0.83 m/s is 3 km/h.
    stationary_speed_threshold: 0.83

    # Past samples kept per track, which bounds how far back the yaw-rate estimate
    # reaches. Larger smooths the estimate but reacts more slowly to a real turn.
    history_size: 10

    # --- gap interpolation ------------------------------------------------------

    # Number of polynomial segments the fitted curve is built from. More segments
    # follow the control points more closely and smooth less.
    spline_segment_count: 8

    # Weight of the fit against the smoothness terms. The two endpoints are hard
    # constraints, so this only governs how closely the interior control points are
    # followed.
    spline_fit_weight: 1.0

    # Smoothness weights, at the 1:5 ratio the previous quadratic program used.
    # Penalising the third difference far more than the second favours slowly
    # changing curvature, which looks like a driven line. At these values a 20 m
    # arc is followed to about 3 mm while 30 cm of noise on the interior control
    # points is rejected rather than tracked.
    spline_second_derivative_weight: 0.2
    spline_third_derivative_weight: 1.0
